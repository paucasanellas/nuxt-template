title: Una plantilla de Nuxt 4 con las decisiones ya tomadas
description: Clónala, renómbrala y publica. Contenido tipado, dos idiomas, estado, un contenedor de dependencias y quality gates, ya conectados.

hero:
  headline: nuxt-template/
  title: Una plantilla que ya sabe dónde va cada cosa.
  description: Clónala, renómbrala y publica. Contenido tipado, dos idiomas, estado, un contenedor de dependencias y las gates que mantienen el repo honesto vienen ya conectados.
  links:
    - label: Usar esta plantilla
      to: https://github.com/paucasanellas/nuxt-template/generate
      trailingIcon: i-lucide-arrow-up-right
      target: _blank

stack:
  headline: package.json
  title: Lo que ya viene conectado
  description: Las decisiones están tomadas, así que tu primer commit en un proyecto nuevo puede ser una funcionalidad en vez de una configuración.
  features:
    - title: Nuxt 4
      description: srcDir es app/. Los componentes se auto-importan sin prefijo de ruta, así que el nombre del fichero es el del componente y tiene que ser único.
    - title: Nuxt UI 4
      description: Todos los componentes U*, tematizados desde un único app/config/ui.ts. Las vistas los componen directamente.
    - title: Tailwind 4
      description: Sin fichero de configuración JS. Los tokens del tema se declaran en un bloque @theme dentro de main.css.
    - title: Nuxt Content 3
      description: Las páginas son datos YAML validados por los schemas de zod de content.config.ts y tipados de extremo a extremo.
    - title: Nuxt i18n 10
      description: Inglés en /, español en /es. Los textos de interfaz viven en app/locales y el copy de página en content/.
    - title: Pinia
      description: Stores con sintaxis setup en app/stores, con el estado agrupado en un único objeto reactive.
    - title: awilix
      description: Un contenedor de dependencias estricto para las rutas de servidor, creado una vez y resuelto por petición.
    - title: ESLint stylistic
      description: El formato es un error de lint, no una segunda herramienta. No hay config de Prettier que mantener sincronizada.
    - title: Husky y commitlint
      description: pre-push ejecuta lint y luego typecheck. commit-msg rechaza un mensaje que no parsee.

conventions:
  headline: shared/schemas/
  title: Una página es un schema, una vista y dos YAML
  description: El schema de zod es el contrato único — valida el YAML en cada build y tipa cada consulta. La vista compone secciones de Nuxt UI; el YAML lleva el copy en cada idioma.
  features:
    - title: shared/schemas/pricing.ts
      description: El contrato. Schemas de elementos — Button, PageHero, PageSection — compuestos en el schema de la página, registrado como colección por idioma en content.config.ts.
    - title: app/pages/pricing.vue
      description: La vista. Enlaza el contenido tipado a secciones de Nuxt UI y es dueña de los anclajes y el layout.
    - title: content/en/pages/pricing.yml
      description: El contenido. Solo datos — copy, enlaces, features. Validado contra el schema, nunca contra un componente.
    - title: content/es/pages/pricing.yml
      description: La misma página en español. Misma forma de fichero, misma validación, otro idioma.

start:
  headline: README.md
  title: Tres comandos hasta tener la app corriendo
  description: El servidor de desarrollo escucha en el 8000, no en el 3000 — .env fija el puerto y Nitro lo coge.
  features:
    - title: pnpm install
      description: Instala dependencias, ejecuta nuxt prepare e instala los hooks de git.
    - title: pnpm dev
      description: Sirve la app en localhost:8000 con las devtools activadas.
    - title: pnpm lint && pnpm typecheck
      description: Las dos gates que ejecutan tanto pre-push como CI. Si aquí pasa, allí también.

cta:
  title: Empieza desde un repo que ya ha tomado estas decisiones
  description: Renómbrala en package.json, sustituye el YAML de content/ y la home es tuya.
  links:
    - label: Usar esta plantilla
      to: https://github.com/paucasanellas/nuxt-template/generate
      trailingIcon: i-lucide-arrow-up-right
      target: _blank
    - label: Leer las convenciones
      to: https://github.com/paucasanellas/nuxt-template/blob/main/CLAUDE.md
      color: neutral
      variant: ghost
      trailingIcon: i-lucide-arrow-up-right
      target: _blank
