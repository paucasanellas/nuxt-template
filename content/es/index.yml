hero:
  root: nuxt-template/
  title: Una plantilla que ya sabe dónde va cada cosa.
  lede: >-
    Clónala, renómbrala y publica. Dos idiomas, contenido, estado, un contenedor de dependencias y
    las gates que mantienen el repo honesto vienen ya conectados.
  tree:
    - path: app/
      note: Las páginas componen secciones. Cada sección vive junto al contexto al que pertenece.
    - path: content/
      note: Cada palabra de esta página, en inglés y español, como YAML tipado.
    - path: server/
      note: Rutas Nitro hexagonales, resueltas desde un contenedor awilix.
    - path: .husky/
      note: El lint y los tipos corren antes de un push. Los mensajes de commit se parsean.
  actions:
    - label: Usar esta plantilla
      to: https://github.com/pcasanellas-dogfy/nuxt-template/generate
  hint: pnpm install && pnpm dev → localhost:8000

stack:
  eyebrow: package.json
  title: Lo que ya viene conectado
  lede: >-
    Las decisiones están tomadas, así que tu primer commit en un proyecto nuevo puede ser una
    funcionalidad en vez de una configuración.
  items:
    - name: Nuxt 4
      note: >-
        srcDir es app/. Los componentes se auto-importan sin prefijo de ruta, así que el nombre del
        fichero es el nombre del componente y tiene que ser único.
    - name: Nuxt UI 4
      note: >-
        Todos los componentes U*, tematizados desde un único app.config.ts. Antes de escribir markup
        propio, busca el que ya existe.
    - name: Tailwind 4
      note: >-
        Sin fichero de configuración JS. Los tokens del tema se declaran en un bloque @theme dentro
        de main.css.
    - name: Nuxt Content 3
      note: >-
        El copy de las páginas vive en YAML, una colección por idioma, validado con un schema de zod.
    - name: Nuxt i18n 10
      note: >-
        Inglés en /, español en /es. Los dos idiomas se prerenderizan, así que los dos son indexables.
    - name: Pinia
      note: >-
        Stores con sintaxis setup en app/stores, con el estado agrupado en un único objeto reactive.
    - name: awilix
      note: >-
        Un contenedor de dependencias estricto para las rutas de servidor, creado una vez y resuelto
        por petición.
    - name: ESLint stylistic
      note: >-
        El formato es un error de lint, no una segunda herramienta. No hay config de Prettier que
        mantener sincronizada.
    - name: Husky y commitlint
      note: >-
        pre-push ejecuta lint y luego typecheck. commit-msg rechaza un mensaje que no parsee.

conventions:
  eyebrow: app/components/
  title: La carpeta te dice en qué capa estás
  lede: >-
    Cada pantalla se parte igual. Los nombres no son decoración: pathPrefix está en false, así que un
    componente se invoca solo por su nombre de fichero y el contexto tiene que ir en el nombre.
  layers:
    - role: Vista
      path: app/pages/index.vue
      note: Compone secciones y nada más. Sin bloque script, sin lógica, sin peticiones.
    - role: Contenedor
      path: app/components/home/hero/HomeHero.vue
      note: La raíz de una sección. Lee lo que la sección necesita y lo baja por props.
    - role: Presentacional
      path: app/components/home/hero/HomeHeroTree.vue
      note: Recibe props y renderiza markup. Se lee sin saber de dónde vinieron los datos.
    - role: Compartido
      path: app/components/app/header/AppHeader.vue
      note: Las mismas tres capas, salvo que la vista es un layout. Aquí va lo que un segundo proyecto querría.

start:
  eyebrow: README.md
  title: Tres comandos hasta tener la app corriendo
  lede: >-
    El servidor de desarrollo escucha en el 8000, no en el 3000 — .env fija el puerto y Nitro lo coge.
  steps:
    - command: pnpm install
      note: Instala dependencias, ejecuta nuxt prepare e instala los hooks de git.
    - command: pnpm dev
      note: Sirve la app en localhost:8000 con las devtools activadas.
    - command: pnpm lint && pnpm typecheck
      note: Las dos gates que ejecutan tanto pre-push como CI. Si aquí pasa, allí también.

cta:
  title: Empieza desde un repo que ya ha tomado estas decisiones
  description: >-
    Renómbrala en package.json, sustituye los dos ficheros de content/ y la home es tuya.
  actions:
    - label: Usar esta plantilla
      to: https://github.com/pcasanellas-dogfy/nuxt-template/generate
    - label: Leer las convenciones
      to: https://github.com/pcasanellas-dogfy/nuxt-template/blob/main/CLAUDE.md
