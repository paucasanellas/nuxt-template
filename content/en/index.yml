hero:
  root: nuxt-template/
  title: A starter that already knows where everything goes.
  lede: >-
    Clone it, rename it, ship. Two languages, content, state, a DI container and the gates that keep
    the repo honest are already wired together.
  tree:
    - path: app/
      note: Pages compose sections. Sections sit next to the context they belong to.
    - path: content/
      note: Every word on this page, in English and Spanish, as typed YAML.
    - path: server/
      note: Hexagonal Nitro routes, resolved through an awilix container.
    - path: .husky/
      note: Lint and types run before a push. Commit messages get parsed.
  actions:
    - label: Use this template
      to: https://github.com/pcasanellas-dogfy/nuxt-template/generate
  hint: pnpm install && pnpm dev → localhost:8000

stack:
  eyebrow: package.json
  title: What comes wired
  lede: >-
    The decisions are already made, so your first commit on a new project can be a feature instead
    of a setup.
  items:
    - name: Nuxt 4
      note: >-
        srcDir is app/. Components auto-import without a path prefix, so a filename is the component
        name and has to be unique.
    - name: Nuxt UI 4
      note: >-
        Every U* component, themed from a single app.config.ts. Reach for one before writing your
        own markup.
    - name: Tailwind 4
      note: >-
        No JS config file. Theme tokens are declared in an @theme block inside main.css.
    - name: Nuxt Content 3
      note: >-
        Page copy lives as YAML, one collection per language, validated against a zod schema.
    - name: Nuxt i18n 10
      note: >-
        English at /, Spanish at /es. Both languages are prerendered, so both are indexable.
    - name: Pinia
      note: >-
        Setup stores in app/stores, with state grouped into one reactive object.
    - name: awilix
      note: >-
        A strict DI container for server routes, built once and resolved per request.
    - name: ESLint stylistic
      note: >-
        Formatting is a lint error, not a second tool. There is no Prettier config to keep in sync.
    - name: Husky and commitlint
      note: >-
        pre-push runs lint then typecheck. commit-msg rejects a message that does not parse.

conventions:
  eyebrow: app/components/
  title: The folder tells you which layer you are in
  lede: >-
    Every screen splits the same way. The names are not decoration: pathPrefix is false, so a
    component is called by its filename alone and the context has to live in the name.
  layers:
    - role: View
      path: app/pages/index.vue
      note: Composes sections and nothing else. No script block, no logic, no fetching.
    - role: Container
      path: app/components/home/hero/HomeHero.vue
      note: The root of one section. It reads what the section needs and hands it down.
    - role: Presentational
      path: app/components/home/hero/HomeHeroTree.vue
      note: Takes props, renders markup. Readable without knowing where the data came from.
    - role: Shared
      path: app/components/app/header/AppHeader.vue
      note: The same three layers, except the view is a layout. Anything a second project wants goes here.

start:
  eyebrow: README.md
  title: Three commands to a running app
  lede: >-
    The dev server listens on 8000, not 3000 — .env sets the port and Nitro picks it up.
  steps:
    - command: pnpm install
      note: Installs dependencies, runs nuxt prepare and installs the git hooks.
    - command: pnpm dev
      note: Serves the app on localhost:8000 with devtools enabled.
    - command: pnpm lint && pnpm typecheck
      note: The two gates that pre-push and CI both run. Green here means green there.

cta:
  title: Start from a repo that has already made these decisions
  description: >-
    Rename it in package.json, replace the two files in content/, and the home page is yours.
  actions:
    - label: Use this template
      to: https://github.com/pcasanellas-dogfy/nuxt-template/generate
    - label: Read the conventions
      to: https://github.com/pcasanellas-dogfy/nuxt-template/blob/main/CLAUDE.md
